services:
  cloudflared:
    image: cloudflare/cloudflared:2025.7.0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN_REQUIRED}
    depends_on:
      - web
    restart: unless-stopped

  web:
    build:
      context: ./Norix.App
      dockerfile: Dockerfile
    depends_on:
      - api
    expose:
      - "80"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: RestauranteSaaS.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=restaurante_saas;Username=norix;Password=${SERVICE_PASSWORD_POSTGRES}
      ConnectionStrings__Redis: redis:6379,password=${SERVICE_PASSWORD_REDIS},abortConnect=false
      Jwt__Issuer: Norix
      Jwt__Audience: Norix
      Jwt__SigningKey: ${SERVICE_PASSWORD_64_JWT}
      Jwt__ExpirationMinutes: 15
      Jwt__CookieName: access_token
      Session__ExpirationMinutes: 15
      Session__KeyPrefix: session
      Database__ApplyMigrationsOnStartup: ${DATABASE_APPLY_MIGRATIONS_ON_STARTUP:-true}
      Database__SeedInitialDataOnStartup: ${DATABASE_SEED_INITIAL_DATA_ON_STARTUP:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: restaurante_saas
      POSTGRES_USER: norix
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - norix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norix -d restaurante_saas"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${SERVICE_PASSWORD_REDIS}"]
    volumes:
      - norix_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SERVICE_PASSWORD_REDIS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  norix_postgres_data:
  norix_redis_data:
