<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rincon Maya | Login</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell login-shell">
    <section class="panel auth-panel">
      <div>
        <p class="eyebrow">Rincon Maya</p>
        <h1>Acceso</h1>
      </div>

      <form id="loginForm" class="form">
        <label>
          Email
          <input id="email" name="email" type="email" autocomplete="username" value="admin@rinconmaya.test" required>
        </label>

        <label>
          Password
          <input id="password" name="password" type="password" autocomplete="current-password" value="Admin123!" required>
        </label>

        <button type="submit">Entrar</button>
      </form>

      <p id="message" class="message" role="status"></p>
    </section>
  </main>

  <script src="/login.js"></script>
</body>
</html>
